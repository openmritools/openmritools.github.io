# Foundations
# The major, comprehensive packages the field is built on — they span multiple
# workflow stages (preprocessing, analysis, registration, visualization), so
# they get their own home rather than being filed under a single stage.
# Fields:
#   name:        display name
#   description: one sentence — what it does, not why it matters
#   url:         homepage or repo
#   github:      owner/repo  (optional, for health checks)
#   language:    primary implementation language

- name: FSL
  description: Comprehensive library for analysis of fMRI, structural, and diffusion MRI data.
  url: https://fsl.fmrib.ox.ac.uk/fsl/fslwiki
  language: C++
  date_added: 2026-06-16
  modality: multi

- name: SPM
  description: Statistical parametric mapping framework for fMRI and voxel-based morphometry analysis.
  url: https://www.fil.ion.ucl.ac.uk/spm
  language: MATLAB
  date_added: 2026-06-16

- name: AFNI
  description: Suite of programs for fMRI preprocessing, regression modelling, and statistical analysis.
  url: https://afni.nimh.nih.gov
  github: afni/afni
  language: C
  date_added: 2026-06-16
  modality: fMRI
  added_by: samtorrisi
  added_by_github: samtorrisi

- name: FreeSurfer
  description: Cortical surface reconstruction, parcellation, and cortical thickness analysis from structural MRI.
  url: https://freesurfer.net
  github: freesurfer/freesurfer
  language: C++
  date_added: 2026-06-16
  modality: structural
  added_by: samtorrisi
  added_by_github: samtorrisi

- name: MRtrix3
  description: Suite for diffusion MRI processing, tractography, and connectome construction using constrained spherical deconvolution.
  url: https://github.com/MRtrix3/mrtrix3
  github: MRtrix3/mrtrix3
  language: C++
  date_added: 2026-06-17
  modality: diffusion

- name: 3D Slicer
  description: Open-source platform for medical image informatics, processing, and 3D visualization; widely used for MRI segmentation and registration.
  url: https://www.slicer.org
  github: Slicer/Slicer
  language: C++/Python
  date_added: 2026-06-21
  modality: multi
